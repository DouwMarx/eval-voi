[project]
name = "voi-rank"
version = "0.2.0"
description = "Rank scenarios by the value of a single measurement (EVSI) with LLM-elicited parameters"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6", "poethepoet>=0.30"]

[tool.uv]
package = false

[tool.poe.tasks]
test = "pytest"
lint = "ruff check ."

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["studies", "templates", "research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
