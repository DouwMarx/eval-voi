[project]
name = "voi-rank"
version = "0.1.0"
description = "Rank scenarios by the value of a single measurement (EVSI) with LLM-elicited parameters"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.uv]
package = false
