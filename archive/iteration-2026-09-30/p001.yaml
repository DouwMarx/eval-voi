name: p001
stages:
  - name: decision
    template_path: templates/decision.md       # renders $agent $decision $theta_definition $decision_context
    params: [p, B, K]
    group_key: self                            # every scenario is its own decision
  - name: instrument
    template_path: templates/instrument.md     # renders the scenario and $context (instrument_context)
    params: [s, t, C_build, C_run, n]
template_vars:
  perspective: society
  # no worked numeric anchors in the headline (research/elicitation_lit.md implication 2).
  # templates/anchors_*.md are kept for an anchors ablation; the C_build, C_run and n
  # triples in templates/anchors_instrument.md are stylised placeholders, not sourced.
  anchors_decision: ''
  anchors_instrument: ''
  context_mode: curated
members:
  - provider: claude_cli
    model: haiku
    k_repeats: 2
  - provider: claude_cli
    model: sonnet
    k_repeats: 2
notes: >
  Headline iteration protocol (DESIGN sections 3 and 4) on the 39 scenarios
  built from research/scenarios_draft/ by scripts/build_scenarios.py: the
  eight-parameter model elicited in two independent prompts per scenario,
  B and K from the society perspective, no numeric anchors, curated context
  (the facts fields without their citation markers), extremes-first
  percentiles and plain decimal numbers. Members and k are the iteration
  pair; the final run uses OpenRouter members with a dedicated key.
