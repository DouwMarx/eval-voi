name: p002
stages:
  - name: decision
    template_path: templates/decision.md       # renders $agent $decision $theta_definition $decision_context
    params: [p, B, K]
    group_key: self                            # every scenario is its own decision
  - name: instrument
    template_path: templates/instrument.md     # renders the scenario and $context (instrument_context)
    params: [s, t, C_build, C_run, n]
template_vars:
  perspective: developer
  # no worked numeric anchors in the headline (research/elicitation_lit.md implication 2).
  # templates/anchors_*.md are kept for an anchors ablation; the C_build, C_run and n
  # triples in templates/anchors_instrument.md are stylised placeholders, not sourced.
  anchors_decision: ''
  anchors_instrument: ''
  context_mode: curated
members:
  - provider: claude_cli
    model: haiku
    k_repeats: 2
  - provider: claude_cli
    model: sonnet
    k_repeats: 2
notes: >
  Developer-perspective ablation of p001: identical except that B and K are
  valued from the developer perspective (the developer's own financial
  exposure: liability, recall, reputation, lost revenue, delay). Run it with
  --stage decision only; the analysis takes the instrument parameters
  (s, t, C_build, C_run, n) from p001, whose instrument prompt does not
  depend on the perspective.
