# Which drafts in research/scenarios_draft/ enter scenarios.json
# (scripts/build_scenarios.py). Every draft key must appear exactly once.
# Rule, scores and ranking: research/scenarios_draft/SELECTION.md (2026-10-02).
# LLM score = presence + 2 x hazard checkability - capability-benchmark penalty
# - construct penalty (only where the score does not measure the hazard).
# Physical-AI score = validity class V + hazard directness H + level spread L.
# A cut scenario keeps its rows in voi.db; seeding marks it retired and the
# Monte Carlo and the analysis leave it out.

# LLM: cyber
cybergym: {include: true, reason: "LLM rank 1, score 14.0: 34 documents, 11 publishers; programmatic score"}
cyber_range: {include: true, reason: "LLM rank 3, score 14.0: 24 documents, 8 publishers; programmatic flag checks"}
exploitgym: {include: true, reason: "LLM rank 4, score 13.92: 23 documents, 8 publishers; programmatic score"}
exploitbench: {include: true, reason: "LLM rank 5, score 13.0: 26 documents, 7 publishers; programmatic score; second known-vulnerability exploitation evaluation"}
cybench: {include: true, reason: "LLM rank 6, score 12.33: 16 documents, 7 publishers; programmatic flag checks"}
binary_exploitation: {include: true, reason: "LLM rank 8, score 11.25: 15 documents, 6 publishers; programmatic score; unknown-vulnerability discovery, a construct of its own"}
cvebench: {include: false, reason: "LLM rank 9, score 11.17, but the third known-vulnerability exploitation evaluation after ExploitGym and ExploitBench; passed over for domain coverage"}
cyscenariobench: {include: true, reason: "LLM rank 15, score 9.08: 13 documents, 4 publishers; programmatic end-state check; second end-to-end intrusion evaluation"}

